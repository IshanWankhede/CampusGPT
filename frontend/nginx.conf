# Map sensitive callback paths to $uri (stripping query string) to prevent code/token leakage in access logs
map $uri $sanitized_request_uri {
    /api/v1/auth/google/callback  $uri;
    /auth/callback                $uri;
    default                       $request_uri;
}

log_format sanitized '$remote_addr - $remote_user [$time_local] '
                     '"$request_method $sanitized_request_uri $server_protocol" '
                     '$status $body_bytes_sent "$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log sanitized;

    root /usr/share/nginx/html;
    index index.html;

    # Global security headers
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
