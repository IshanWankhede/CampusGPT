<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Module 2 — Login Flow (CampusGPT)</title>


<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    display: flex;

    justify-content: center;

    padding: 40px 16px;

    color: #e5e7eb;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(124, 58, 237, 0.20),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(14, 165, 233, 0.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(16, 185, 129, 0.10),
            transparent 35%
        ),

        #050816;

    background-size: 200% 200%;

    animation:
        backgroundMove
        15s ease-in-out infinite;
}


@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

    position: relative;

    width: 100%;

    max-width: 820px;

    padding: 34px 30px;

    border-radius: 28px;

    background:
        rgba(10, 16, 30, 0.82);

    border:
        1px solid
        rgba(148, 163, 184, 0.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 35px 100px
        rgba(0, 0, 0, 0.55),

        0 10px 35px
        rgba(0, 0, 0, 0.35),

        inset 0 1px 0
        rgba(255, 255, 255, 0.06);

    overflow: hidden;

    animation:
        cardEntrance
        1s cubic-bezier(.16,1,.3,1);
}


@keyframes cardEntrance {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   AMBIENT GLOW
========================================================= */

.card::before {

    content: "";

    position: absolute;

    width: 420px;

    height: 420px;

    top: -250px;

    left: -200px;

    background:

        radial-gradient(
            circle,
            rgba(124, 58, 237, 0.18),
            transparent 70%
        );

    pointer-events: none;

    animation:
        glowMove
        9s ease-in-out infinite;
}


.card::after {

    content: "";

    position: absolute;

    width: 400px;

    height: 400px;

    right: -220px;

    bottom: -220px;

    background:

        radial-gradient(
            circle,
            rgba(14, 165, 233, 0.13),
            transparent 70%
        );

    pointer-events: none;

    animation:
        glowMove
        11s ease-in-out infinite reverse;
}


@keyframes glowMove {

    0%,
    100% {

        transform:
            translate(0, 0);

    }

    50% {

        transform:
            translate(35px, 30px);

    }

}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: relative;

    z-index: 5;

    text-align: center;

    margin-bottom: 28px;
}


.badge {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 7px 14px;

    margin-bottom: 13px;

    border-radius: 999px;

    background:

        linear-gradient(
            135deg,
            rgba(124,58,237,.16),
            rgba(14,165,233,.13)
        );

    border:
        1px solid
        rgba(139,92,246,.25);

    color:
        #c4b5fd;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .6px;

    text-transform: uppercase;
}


.badge-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background:
        #a78bfa;

    box-shadow:
        0 0 0 4px
        rgba(139,92,246,.12);

    animation:
        pulseDot
        2s ease-in-out infinite;
}


@keyframes pulseDot {

    0%,
    100% {

        box-shadow:
            0 0 0 4px
            rgba(139,92,246,.12);

    }

    50% {

        box-shadow:
            0 0 0 8px
            rgba(139,92,246,.03);

    }

}


h1 {

    font-size: 25px;

    font-weight: 750;

    letter-spacing: -.7px;

    margin-bottom: 8px;

    background:

        linear-gradient(
            90deg,
            #ddd6fe,
            #a78bfa,
            #7dd3fc
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.subtitle {

    max-width: 680px;

    margin: auto;

    font-size: 12px;

    line-height: 1.6;

    color:
        #94a3b8;
}


/* =========================================================
   SVG
========================================================= */

svg {

    position: relative;

    z-index: 3;

    overflow: visible;
}


svg text {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.th {

    font-size: 14px;

    font-weight: 650;

    letter-spacing: -.15px;
}


.ts {

    font-size: 11.5px;

    font-weight: 450;
}


/* =========================================================
   PURPLE
========================================================= */

.c-purple rect,
.c-purple ellipse {

    fill:
        #1d1638;

    stroke:
        #8b5cf6;

    stroke-width:
        1;
}


.c-purple text {

    fill:
        #c4b5fd;
}


/* =========================================================
   TEAL
========================================================= */

.c-teal rect,
.c-teal ellipse {

    fill:
        #0b2928;

    stroke:
        #14b8a6;

    stroke-width:
        1;
}


.c-teal text {

    fill:
        #5eead4;
}


/* =========================================================
   BLUE
========================================================= */

.c-blue rect,
.c-blue ellipse {

    fill:
        #0d2539;

    stroke:
        #38bdf8;

    stroke-width:
        1;
}


.c-blue text {

    fill:
        #7dd3fc;
}


/* =========================================================
   AMBER
========================================================= */

.c-amber rect,
.c-amber ellipse {

    fill:
        #2d2110;

    stroke:
        #f59e0b;

    stroke-width:
        1;
}


.c-amber text {

    fill:
        #fcd34d;
}


/* =========================================================
   GREEN
========================================================= */

.c-green rect,
.c-green ellipse {

    fill:
        #0d281b;

    stroke:
        #22c55e;

    stroke-width:
        1;
}


.c-green text {

    fill:
        #86efac;
}


/* =========================================================
   RED
========================================================= */

.c-red rect,
.c-red ellipse {

    fill:
        #301519;

    stroke:
        #ef4444;

    stroke-width:
        1;
}


.c-red text {

    fill:
        #fca5a5;
}


/* =========================================================
   GRAY
========================================================= */

.c-gray rect,
.c-gray ellipse {

    fill:
        #131c2e;

    stroke:
        #64748b;

    stroke-width:
        1;
}


.c-gray text {

    fill:
        #cbd5e1;
}


/* =========================================================
   DECISION DIAMONDS
========================================================= */

.decision {

    fill:
        url(#decisionGradient);

    stroke:
        #a78bfa;

    stroke-width:
        1.5;

    filter:

        drop-shadow(
            0 0 10px
            rgba(139,92,246,.25)
        );

    animation:
        decisionGlow
        3.5s ease-in-out infinite;
}


@keyframes decisionGlow {

    0%,
    100% {

        filter:

            drop-shadow(
                0 0 7px
                rgba(139,92,246,.20)
            );

    }

    50% {

        filter:

            drop-shadow(
                0 0 20px
                rgba(139,92,246,.42)
            );

    }

}


/* =========================================================
   NODE HOVER
========================================================= */

svg g {

    transform-box:
        fill-box;

    transform-origin:
        center;

    transition:
        transform .35s ease,
        filter .35s ease;
}


svg g:hover {

    transform:
        translateY(-3px)
        scale(1.012);

    filter:

        drop-shadow(
            0 10px 18px
            rgba(0,0,0,.35)
        );
}


/* =========================================================
   FLOW LINES
========================================================= */

.flow-line {

    stroke:
        #64748b;

    stroke-width:
        1.8;

    fill:
        none;

    marker-end:
        url(#arrow);

    stroke-linecap:
        round;

    stroke-dasharray:
        7 5;

    animation:
        flowDash
        1.5s linear infinite;
}


@keyframes flowDash {

    to {

        stroke-dashoffset:
            -24;

    }

}


/* =========================================================
   GREEN FLOW
========================================================= */

.flow-green {

    stroke:
        #22c55e;

    stroke-width:
        2;

    fill:
        none;

    marker-end:
        url(#arrow-green);

    stroke-linecap:
        round;

    stroke-dasharray:
        7 5;

    animation:
        flowDashGreen
        1.25s linear infinite;
}


@keyframes flowDashGreen {

    to {

        stroke-dashoffset:
            -24;

    }

}


/* =========================================================
   RED FLOW
========================================================= */

.flow-red {

    stroke:
        #ef4444;

    stroke-width:
        1.8;

    fill:
        none;

    marker-end:
        url(#arrow-red);

    stroke-linecap:
        round;

    stroke-dasharray:
        5 4;

    animation:
        flowDashRed
        1s linear infinite;
}


@keyframes flowDashRed {

    to {

        stroke-dashoffset:
            -18;

    }

}


/* =========================================================
   SIDE LABELS
========================================================= */

.side-label {

    opacity:
        .82;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.side-label:hover {

    opacity:
        1;

    transform:
        translateX(4px);
}


/* =========================================================
   SUMMARY BOX
========================================================= */

.summary-box {

    fill:
        rgba(15,23,42,.72);

    stroke:
        rgba(148,163,184,.25);

    stroke-width:
        .8;

    filter:

        drop-shadow(
            0 12px 25px
            rgba(0,0,0,.25)
        );
}


.summary-title {

    fill:
        #e2e8f0;

    font-size:
        13px;

    font-weight:
        650;
}


/* =========================================================
   PRINT
========================================================= */

.print-note {

    position:
        relative;

    z-index:
        5;

    margin-top:
        24px;

    font-size:
        11px;

    color:
        #64748b;

    text-align:
        center;
}


@media print {

    body {

        background:
            white;

        padding:
            0;

        color:
            black;
    }

    .card {

        border:
            none;

        box-shadow:
            none;

        background:
            white;

        padding:
            16px;

        max-width:
            none;
    }

    .badge {

        display:
            none;
    }

    .print-note {

        display:
            none;
    }

    .flow-line,
    .flow-green,
    .flow-red,
    .decision,
    .badge-dot {

        animation:
            none;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    body {

        padding:
            12px 7px;
    }

    .card {

        padding:
            24px 8px;

        border-radius:
            20px;
    }

    h1 {

        font-size:
            20px;
    }

    .subtitle {

        font-size:
            10px;
    }

}

</style>

</head>


<body>


<div class="card">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="badge">

            <span class="badge-dot"></span>

            CampusGPT · Authentication

        </div>


        <h1>
            Module 2 — Login Flow
        </h1>


        <p class="subtitle">

            Frontend: features/auth/SignIn.jsx
            &nbsp;·&nbsp;

            Backend: app/auth/router.py, service.py
            &nbsp;·&nbsp;

            Reads: users

        </p>

    </div>



    <!-- =====================================================
         SVG FLOW DIAGRAM
    ====================================================== -->

    <svg
        width="100%"
        viewBox="0 0 720 1360"
        xmlns="http://www.w3.org/2000/svg"
    >


        <!-- =================================================
             DEFINITIONS
        ================================================== -->

        <defs>


            <!-- LIGHT DECISION GRADIENT -->

            <linearGradient
                id="decisionGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
            >

                <stop
                    offset="0%"
                    stop-color="#faf5ff"
                />

                <stop
                    offset="50%"
                    stop-color="#ddd6fe"
                />

                <stop
                    offset="100%"
                    stop-color="#bae6fd"
                />

            </linearGradient>


            <!-- NORMAL ARROW -->

            <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#64748b"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>


            <!-- RED ARROW -->

            <marker
                id="arrow-red"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#ef4444"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>


            <!-- GREEN ARROW -->

            <marker
                id="arrow-green"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#22c55e"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>

        </defs>



        <!-- =================================================
             START
        ================================================== -->

        <g class="c-gray">

            <rect
                x="240"
                y="16"
                width="240"
                height="44"
                rx="22"
            />

            <text
                class="th"
                x="360"
                y="38"
                text-anchor="middle"
                dominant-baseline="central"
            >
                User opens Sign In tab
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="60"
            x2="360"
            y2="86"
        />



        <!-- =================================================
             LOGIN FORM
        ================================================== -->

        <g class="c-purple">

            <rect
                x="140"
                y="86"
                width="440"
                height="78"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="112"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Select College · enter Campus Email + Password
            </text>

            <text
                class="ts"
                x="360"
                y="132"
                text-anchor="middle"
                dominant-baseline="central"
            >
                CollegeSelector.jsx (compact) + controlled form inputs
            </text>

            <text
                class="ts"
                x="360"
                y="148"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Click "Sign In"
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="164"
            x2="360"
            y2="190"
        />



        <!-- =================================================
             LOGIN API
        ================================================== -->

        <g class="c-teal">

            <rect
                x="140"
                y="190"
                width="440"
                height="56"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="212"
                text-anchor="middle"
                dominant-baseline="central"
            >
                POST /api/v1/auth/login
            </text>

            <text
                class="ts"
                x="360"
                y="230"
                text-anchor="middle"
                dominant-baseline="central"
            >
                { email, password, college }
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="246"
            x2="360"
            y2="272"
        />



        <!-- =================================================
             DECISION 1 — USER EXISTS
        ================================================== -->

        <polygon
            points="360,272 490,308 360,344 230,308"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="304"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            User exists
        </text>

        <text
            class="ts"
            x="360"
            y="320"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            by email?
        </text>


        <!-- NO -->

        <line
            class="flow-red"
            x1="230"
            y1="308"
            x2="160"
            y2="308"
        />


        <g class="c-red">

            <rect
                x="30"
                y="294"
                width="130"
                height="28"
                rx="8"
            />

            <text
                class="ts"
                x="95"
                y="308"
                text-anchor="middle"
                dominant-baseline="central"
            >
                401 Invalid credentials
            </text>

        </g>


        <text
            class="ts"
            x="200"
            y="292"
            text-anchor="middle"
            fill="#fca5a5"
        >
            No
        </text>


        <!-- YES -->

        <line
            class="flow-line"
            x1="360"
            y1="344"
            x2="360"
            y2="370"
        />


        <text
            class="ts"
            x="376"
            y="358"
            dominant-baseline="central"
            fill="#4ade80"
        >
            Yes
        </text>



        <!-- =================================================
             PASSWORD VERIFY
        ================================================== -->

        <g class="c-amber">

            <rect
                x="140"
                y="370"
                width="440"
                height="58"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="392"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Verify password against hashed_password
            </text>

            <text
                class="ts"
                x="360"
                y="410"
                text-anchor="middle"
                dominant-baseline="central"
            >
                passlib bcrypt verify()
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="428"
            x2="360"
            y2="454"
        />



        <!-- =================================================
             DECISION 2 — PASSWORD
        ================================================== -->

        <polygon
            points="360,454 490,490 360,526 230,490"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="486"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            Password
        </text>

        <text
            class="ts"
            x="360"
            y="502"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            correct?
        </text>


        <!-- NO -->

        <line
            class="flow-red"
            x1="230"
            y1="490"
            x2="160"
            y2="490"
        />


        <g class="c-red">

            <rect
                x="30"
                y="476"
                width="130"
                height="28"
                rx="8"
            />

            <text
                class="ts"
                x="95"
                y="490"
                text-anchor="middle"
                dominant-baseline="central"
            >
                401 Invalid credentials
            </text>

        </g>


        <text
            class="ts"
            x="200"
            y="474"
            text-anchor="middle"
            fill="#fca5a5"
        >
            No
        </text>


        <!-- YES -->

        <line
            class="flow-line"
            x1="360"
            y1="526"
            x2="360"
            y2="552"
        />


        <text
            class="ts"
            x="376"
            y="540"
            dominant-baseline="central"
            fill="#4ade80"
        >
            Yes
        </text>



        <!-- =================================================
             DECISION 3 — ADMIN
        ================================================== -->

        <polygon
            points="360,552 510,592 360,632 210,592"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="586"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            user.role ==
        </text>

        <text
            class="ts"
            x="360"
            y="604"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            ADMIN?
        </text>


        <!-- ADMIN YES -->

        <line
            class="flow-green"
            x1="510"
            y1="592"
            x2="580"
            y2="592"
        />


        <g class="c-green">

            <rect
                x="580"
                y="578"
                width="120"
                height="28"
                rx="8"
            />

            <text
                class="ts"
                x="640"
                y="592"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Skip college check
            </text>

        </g>


        <text
            class="ts"
            x="524"
            y="578"
            text-anchor="middle"
            fill="#86efac"
        >
            Yes
        </text>


        <!-- STUDENT/FACULTY -->

        <line
            class="flow-line"
            x1="360"
            y1="632"
            x2="360"
            y2="658"
        />


        <text
            class="ts"
            x="376"
            y="646"
            dominant-baseline="central"
            fill="#94a3b8"
        >
            No — STUDENT/FACULTY
        </text>



        <!-- =================================================
             COLLEGE CHECK
        ================================================== -->

        <polygon
            points="360,658 510,698 360,738 210,698"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="692"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            Selected college ==
        </text>

        <text
            class="ts"
            x="360"
            y="710"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            user.college on file?
        </text>


        <!-- COLLEGE MISMATCH -->

        <line
            class="flow-red"
