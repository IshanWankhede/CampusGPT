<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusGPT — Registration Flow</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


/* =========================================================
   BODY
========================================================= */

body {

    min-height: 100vh;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;

    display: flex;
    justify-content: center;

    padding: 40px 16px;

    color: #e5e7eb;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(124, 58, 237, 0.20),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 20%,
            rgba(14, 165, 233, 0.16),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(16, 185, 129, 0.10),
            transparent 35%
        ),

        #050816;

    background-size: 200% 200%;

    animation:
        backgroundMove
        15s ease-in-out infinite;
}


@keyframes backgroundMove {

    0% {
        background-position: 0% 50%;
    }

    50% {
        background-position: 100% 50%;
    }

    100% {
        background-position: 0% 50%;
    }

}


/* =========================================================
   MAIN CARD
========================================================= */

.card {

    position: relative;

    width: 100%;

    max-width: 820px;

    padding: 34px 30px;

    border-radius: 28px;

    background:
        rgba(10, 16, 30, 0.82);

    border:
        1px solid
        rgba(148, 163, 184, 0.16);

    backdrop-filter:
        blur(25px);

    -webkit-backdrop-filter:
        blur(25px);

    box-shadow:

        0 35px 100px
        rgba(0, 0, 0, 0.55),

        0 10px 35px
        rgba(0, 0, 0, 0.35),

        inset 0 1px 0
        rgba(255, 255, 255, 0.06);

    overflow: hidden;

    animation:
        cardEntrance
        1s cubic-bezier(.16,1,.3,1);
}


@keyframes cardEntrance {

    from {

        opacity: 0;

        transform:
            translateY(35px)
            scale(.97);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* =========================================================
   DECORATIVE GLOWS
========================================================= */

.card::before {

    content: "";

    position: absolute;

    width: 420px;
    height: 420px;

    top: -250px;
    left: -200px;

    background:

        radial-gradient(
            circle,
            rgba(124, 58, 237, 0.18),
            transparent 70%
        );

    pointer-events: none;

    animation:
        glowMove
        9s ease-in-out infinite;
}


.card::after {

    content: "";

    position: absolute;

    width: 400px;
    height: 400px;

    right: -220px;
    bottom: -220px;

    background:

        radial-gradient(
            circle,
            rgba(14, 165, 233, 0.13),
            transparent 70%
        );

    pointer-events: none;

    animation:
        glowMove
        11s ease-in-out infinite
        reverse;
}


@keyframes glowMove {

    0%,
    100% {

        transform:
            translate(0, 0);
    }

    50% {

        transform:
            translate(35px, 30px);
    }

}


/* =========================================================
   HEADER
========================================================= */

.header {

    position: relative;

    z-index: 5;

    text-align: center;

    margin-bottom: 28px;
}


.badge {

    display: inline-flex;

    align-items: center;

    gap: 8px;

    padding: 7px 14px;

    margin-bottom: 13px;

    border-radius: 999px;

    background:
        linear-gradient(
            135deg,
            rgba(124,58,237,.16),
            rgba(14,165,233,.13)
        );

    border:
        1px solid
        rgba(139,92,246,.25);

    color: #c4b5fd;

    font-size: 11px;

    font-weight: 700;

    letter-spacing: .6px;

    text-transform: uppercase;
}


.badge-dot {

    width: 7px;

    height: 7px;

    border-radius: 50%;

    background: #a78bfa;

    box-shadow:
        0 0 0 4px
        rgba(139,92,246,.12);

    animation:
        pulseDot
        2s ease-in-out infinite;
}


@keyframes pulseDot {

    0%,
    100% {

        box-shadow:
            0 0 0 4px
            rgba(139,92,246,.12);
    }

    50% {

        box-shadow:
            0 0 0 8px
            rgba(139,92,246,.03);
    }

}


h1 {

    font-size: 25px;

    font-weight: 750;

    letter-spacing: -.7px;

    margin-bottom: 8px;

    background:

        linear-gradient(
            90deg,
            #ddd6fe,
            #a78bfa,
            #7dd3fc
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}


.subtitle {

    max-width: 680px;

    margin: auto;

    font-size: 12px;

    line-height: 1.6;

    color: #94a3b8;
}


/* =========================================================
   SVG
========================================================= */

svg {

    position: relative;

    z-index: 3;

    overflow: visible;
}


svg text {

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
}


.th {

    font-size: 14px;

    font-weight: 650;

    letter-spacing: -.15px;
}


.ts {

    font-size: 11.5px;

    font-weight: 450;
}


/* =========================================================
   NODE HOVER
========================================================= */

svg g {

    transform-box: fill-box;

    transform-origin: center;

    transition:
        transform .35s ease,
        filter .35s ease;
}


svg g:hover {

    transform:
        translateY(-3px)
        scale(1.012);

    filter:

        drop-shadow(
            0 10px 18px
            rgba(0,0,0,.35)
        );
}


/* =========================================================
   PURPLE
========================================================= */

.c-purple rect,
.c-purple ellipse {

    fill: #1d1638;

    stroke: #8b5cf6;

    stroke-width: 1;
}


.c-purple text {

    fill: #c4b5fd;
}


/* =========================================================
   TEAL
========================================================= */

.c-teal rect,
.c-teal ellipse {

    fill: #0b2928;

    stroke: #14b8a6;

    stroke-width: 1;
}


.c-teal text {

    fill: #5eead4;
}


/* =========================================================
   BLUE
========================================================= */

.c-blue rect,
.c-blue ellipse {

    fill: #0d2539;

    stroke: #38bdf8;

    stroke-width: 1;
}


.c-blue text {

    fill: #7dd3fc;
}


/* =========================================================
   AMBER
========================================================= */

.c-amber rect,
.c-amber ellipse {

    fill: #2d2110;

    stroke: #f59e0b;

    stroke-width: 1;
}


.c-amber text {

    fill: #fcd34d;
}


/* =========================================================
   GREEN
========================================================= */

.c-green rect,
.c-green ellipse {

    fill: #0d281b;

    stroke: #22c55e;

    stroke-width: 1;
}


.c-green text {

    fill: #86efac;
}


/* =========================================================
   RED
========================================================= */

.c-red rect,
.c-red ellipse {

    fill: #301519;

    stroke: #ef4444;

    stroke-width: 1;
}


.c-red text {

    fill: #fca5a5;
}


/* =========================================================
   GRAY
========================================================= */

.c-gray rect,
.c-gray ellipse {

    fill: #131c2e;

    stroke: #64748b;

    stroke-width: 1;
}


.c-gray text {

    fill: #cbd5e1;
}


/* =========================================================
   ✨ DECISION DIAMONDS
========================================================= */

.decision {

    fill:
        url(#decisionGradient);

    stroke:
        #a78bfa;

    stroke-width:
        1.5;

    filter:

        drop-shadow(
            0 0 10px
            rgba(139,92,246,.25)
        );

    animation:
        decisionGlow
        3.5s ease-in-out infinite;
}


@keyframes decisionGlow {

    0%,
    100% {

        filter:

            drop-shadow(
                0 0 7px
                rgba(139,92,246,.20)
            );
    }

    50% {

        filter:

            drop-shadow(
                0 0 20px
                rgba(139,92,246,.42)
            );
    }

}


/* =========================================================
   FLOW LINES
========================================================= */

.flow-line {

    stroke:
        #64748b;

    stroke-width:
        1.8;

    fill:
        none;

    marker-end:
        url(#arrow);

    stroke-linecap:
        round;

    stroke-dasharray:
        7 5;

    animation:
        flowDash
        1.5s linear infinite;
}


@keyframes flowDash {

    to {

        stroke-dashoffset:
            -24;
    }

}


/* =========================================================
   GREEN FLOW
========================================================= */

.flow-green {

    stroke:
        #22c55e;

    stroke-width:
        2;

    fill:
        none;

    marker-end:
        url(#arrow-green);

    stroke-linecap:
        round;

    stroke-dasharray:
        7 5;

    animation:
        flowDashGreen
        1.25s linear infinite;
}


@keyframes flowDashGreen {

    to {

        stroke-dashoffset:
            -24;
    }

}


/* =========================================================
   RED FLOW
========================================================= */

.flow-red {

    stroke:
        #ef4444;

    stroke-width:
        1.7;

    fill:
        none;

    marker-end:
        url(#arrow-red);

    stroke-linecap:
        round;

    stroke-dasharray:
        5 4;

    animation:
        flowDashRed
        1s linear infinite;
}


@keyframes flowDashRed {

    to {

        stroke-dashoffset:
            -18;
    }

}


/* =========================================================
   SIDE LABELS
========================================================= */

.side-label {

    opacity: .8;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


.side-label:hover {

    opacity: 1;

    transform:
        translateX(4px);
}


/* =========================================================
   PRINT
========================================================= */

.print-note {

    position: relative;

    z-index: 5;

    margin-top: 24px;

    font-size: 11px;

    color: #64748b;

    text-align: center;
}


@media print {

    body {

        background: white;

        padding: 0;

        color: black;
    }

    .card {

        border: none;

        box-shadow: none;

        background: white;

        padding: 16px;

        max-width: none;
    }

    .badge {

        display: none;
    }

    .print-note {

        display: none;
    }

    .flow-line,
    .flow-green,
    .flow-red,
    .decision,
    .badge-dot {

        animation: none;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    body {

        padding:
            12px 7px;
    }

    .card {

        padding:
            24px 8px;

        border-radius:
            20px;
    }

    h1 {

        font-size:
            20px;
    }

    .subtitle {

        font-size:
            10px;
    }

}

</style>
</head>


<body>


<div class="card">


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <div class="header">

        <div class="badge">

            <span class="badge-dot"></span>

            CampusGPT · Authentication

        </div>

        <h1>
            Module 1 — Registration Flow
        </h1>

        <p class="subtitle">

            Frontend: features/auth/SignUp.jsx
            &nbsp;·&nbsp;

            Backend: app/auth/router.py, service.py
            &nbsp;·&nbsp;

            Writes: users, otp_verifications

        </p>

    </div>



    <!-- =====================================================
         FLOW DIAGRAM
    ====================================================== -->

    <svg
        width="100%"
        viewBox="0 0 720 1720"
        xmlns="http://www.w3.org/2000/svg"
    >


        <!-- =================================================
             DEFINITIONS
        ================================================== -->

        <defs>


            <!-- LIGHT DECISION DIAMOND -->

            <linearGradient
                id="decisionGradient"
                x1="0%"
                y1="0%"
                x2="100%"
                y2="100%"
            >

                <stop
                    offset="0%"
                    stop-color="#faf5ff"
                />

                <stop
                    offset="50%"
                    stop-color="#ddd6fe"
                />

                <stop
                    offset="100%"
                    stop-color="#bae6fd"
                />

            </linearGradient>


            <!-- MAIN ARROW -->

            <marker
                id="arrow"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#64748b"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>


            <!-- RED ARROW -->

            <marker
                id="arrow-red"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#ef4444"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>


            <!-- GREEN ARROW -->

            <marker
                id="arrow-green"
                viewBox="0 0 10 10"
                refX="8"
                refY="5"
                markerWidth="6"
                markerHeight="6"
                orient="auto-start-reverse"
            >

                <path
                    d="M2 1L8 5L2 9"
                    fill="none"
                    stroke="#22c55e"
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                />

            </marker>


        </defs>



        <!-- =================================================
             START
        ================================================== -->

        <g class="c-gray">

            <rect
                x="240"
                y="16"
                width="240"
                height="44"
                rx="22"
            />

            <text
                class="th"
                x="360"
                y="38"
                text-anchor="middle"
                dominant-baseline="central"
            >
                User opens Sign Up tab
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="60"
            x2="360"
            y2="86"
        />



        <!-- =================================================
             SELECT COLLEGE
        ================================================== -->

        <g class="c-purple">

            <rect
                x="140"
                y="86"
                width="440"
                height="66"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="110"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Select College / Institute
            </text>

            <text
                class="ts"
                x="360"
                y="130"
                text-anchor="middle"
                dominant-baseline="central"
            >
                COEP · PICT · VIT — segmented control
            </text>

        </g>



        <!-- SIDE UI -->

        <g class="c-gray side-label">

            <rect
                x="36"
                y="98"
                width="94"
                height="44"
                rx="8"
            />

            <text
                class="th"
                x="83"
                y="114"
                text-anchor="middle"
                dominant-baseline="central"
                font-size="12"
            >
                UI:
            </text>

            <text
                class="ts"
                x="83"
                y="132"
                text-anchor="middle"
                dominant-baseline="central"
            >
                React state
            </text>

        </g>


        <line
            x1="140"
            y1="120"
            x2="132"
            y2="120"
            stroke="#475569"
            stroke-width=".7"
            stroke-dasharray="4 3"
        />


        <line
            class="flow-line"
            x1="360"
            y1="152"
            x2="360"
            y2="178"
        />



        <!-- =================================================
             FORM
        ================================================== -->

        <g class="c-purple">

            <rect
                x="140"
                y="178"
                width="440"
                height="78"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="202"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Fill Full Name, University Email, Role
            </text>

            <text
                class="ts"
                x="360"
                y="222"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Placeholder updates per college: name@{domain}
            </text>

            <text
                class="ts"
                x="360"
                y="240"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Password + Confirm Password fields
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="256"
            x2="360"
            y2="282"
        />



        <!-- =================================================
             DECISION 1
        ================================================== -->

        <polygon
            points="360,282 500,320 360,358 220,320"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="314"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            Email domain matches
        </text>

        <text
            class="ts"
            x="360"
            y="332"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            selected college?
        </text>


        <!-- DOMAIN LOOKUP -->

        <g class="c-blue">

            <rect
                x="516"
                y="306"
                width="174"
                height="28"
                rx="8"
            />

            <text
                class="ts"
                x="603"
                y="320"
                text-anchor="middle"
                dominant-baseline="central"
            >
                COLLEGE_DOMAIN_MAP lookup
            </text>

        </g>


        <!-- NO -->

        <line
            class="flow-red"
            x1="220"
            y1="320"
            x2="150"
            y2="320"
        />


        <g class="c-red">

            <rect
                x="20"
                y="300"
                width="130"
                height="40"
                rx="8"
            />

            <text
                class="ts"
                x="85"
                y="314"
                text-anchor="middle"
                dominant-baseline="central"
            >
                "Please enter a college
            </text>

            <text
                class="ts"
                x="85"
                y="328"
                text-anchor="middle"
                dominant-baseline="central"
            >
                email containing @domain"
            </text>

        </g>


        <text
            class="ts"
            x="190"
            y="298"
            text-anchor="middle"
            fill="#f87171"
        >
            No
        </text>


        <!-- YES -->

        <line
            class="flow-line"
            x1="360"
            y1="358"
            x2="360"
            y2="384"
        />

        <text
            class="ts"
            x="376"
            y="372"
            dominant-baseline="central"
            fill="#4ade80"
        >
            Yes
        </text>



        <!-- =================================================
             VERIFY EMAIL
        ================================================== -->

        <g class="c-teal">

            <rect
                x="140"
                y="384"
                width="440"
                height="56"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="406"
                text-anchor="middle"
                dominant-baseline="central"
            >
                User clicks "Verify Email"
            </text>

            <text
                class="ts"
                x="360"
                y="424"
                text-anchor="middle"
                dominant-baseline="central"
            >
                "Verify Email" button appears below the email field
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="440"
            x2="360"
            y2="466"
        />



        <!-- =================================================
             SEND OTP
        ================================================== -->

        <g class="c-teal">

            <rect
                x="120"
                y="466"
                width="480"
                height="70"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="490"
                text-anchor="middle"
                dominant-baseline="central"
            >
                POST /api/v1/auth/send-otp
            </text>

            <text
                class="ts"
                x="360"
                y="510"
                text-anchor="middle"
                dominant-baseline="central"
            >
                { email, college, purpose: EMAIL_VERIFY }
            </text>

            <text
                class="ts"
                x="360"
                y="528"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Backend re-validates domain server-side
            </text>

        </g>


        <line
            class="flow-line"
            x1="360"
            y1="536"
            x2="360"
            y2="562"
        />



        <!-- =================================================
             DECISION 2
        ================================================== -->

        <polygon
            points="360,562 500,600 360,638 220,600"
            class="decision"
        />

        <text
            class="th"
            x="360"
            y="594"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#4c1d95"
        >
            3+ OTPs sent in
        </text>

        <text
            class="ts"
            x="360"
            y="612"
            text-anchor="middle"
            dominant-baseline="central"
            fill="#475569"
        >
            last 15 minutes?
        </text>


        <line
            class="flow-red"
            x1="500"
            y1="600"
            x2="568"
            y2="600"
        />


        <g class="c-red">

            <rect
                x="568"
                y="586"
                width="120"
                height="28"
                rx="8"
            />

            <text
                class="ts"
                x="628"
                y="600"
                text-anchor="middle"
                dominant-baseline="central"
            >
                429 Too many requests
            </text>

        </g>


        <text
            class="ts"
            x="512"
            y="586"
            text-anchor="middle"
            fill="#f87171"
        >
            Yes
        </text>


        <line
            class="flow-line"
            x1="360"
            y1="638"
            x2="360"
            y2="664"
        />


        <text
            class="ts"
            x="376"
            y="652"
            dominant-baseline="central"
            fill="#4ade80"
        >
            No, within limit
        </text>



        <!-- =================================================
             GENERATE OTP
        ================================================== -->

        <g class="c-amber">

            <rect
                x="120"
                y="664"
                width="480"
                height="86"
                rx="12"
            />

            <text
                class="th"
                x="360"
                y="688"
                text-anchor="middle"
                dominant-baseline="central"
            >
                Generate 6-digit OTP · hash it · store
            </text>

            <text
                class="ts"
                x="360"
                y="706"
                text-anchor="middle"
                dominant-baseline="central"
            >
                bcrypt hash of OTP (passlib) — never stored in plaintext
            </text>

            <text
                class="ts"
                x="360"
                y="724"
                text-anchor="middle"
                dominant-baseline="central"
            >
                INSERT otp_verifications (user_id=null, email, otp_hash,
            </text>

            <text
                class="ts"
