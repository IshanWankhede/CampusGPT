services:
  campusgpt_db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-campusgpt}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campusgpt_dev}
      POSTGRES_DB: ${POSTGRES_DB:-campusgpt}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campusgpt} -d ${POSTGRES_DB:-campusgpt}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campusgpt_network

  # One-shot migration runner: applies Alembic migrations and exits cleanly
  migrate:
    build:
      context: ./backend
    restart: "no"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://campusgpt:campusgpt_dev@campusgpt_db:5432/campusgpt}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      campusgpt_db:
        condition: service_healthy
    networks:
      - campusgpt_network

  # Core API service: never runs migrations automatically on launch
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg2://campusgpt:campusgpt_dev@campusgpt_db:5432/campusgpt}
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      campusgpt_db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - campusgpt_network

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - campusgpt_network

volumes:
  pgdata:

networks:
  campusgpt_network:
    driver: bridge
